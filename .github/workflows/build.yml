name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project files if zip exists
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          unzip -o *.zip
        fi
        
        # البحث عن ملف buildozer.spec ونقل محتويات مجلده للمسار الرئيسي
        SPEC_DIR=$(find . -name "buildozer.spec" -exec dirname {} \;)
        if [ "$SPEC_DIR" != "." ] && [ -n "$SPEC_DIR" ]; then
          cp -rn $SPEC_DIR/* .
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: bin/*.apk
        
