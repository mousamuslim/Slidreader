name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev build-essential wget

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Setup Android SDK Manager & Licenses
      run: |
        # 1. إنشاء هياكل المجلدات للـ SDK
        ANDROID_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$ANDROID_SDK_DIR/cmdline-tools"
        
        # 2. تنزيل وتثبيت Command Line Tools الحديثة
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p "$ANDROID_SDK_DIR/cmdline-tools/latest"
        mv cmdline-tools/* "$ANDROID_SDK_DIR/cmdline-tools/latest/" 2>/dev/null || true
        rm -rf cmdline-tools.zip cmdline-tools
        
        # 3. حل مشكلة المسار القديم عبر إنشاء Symlink لمجلد tools/bin
        mkdir -p "$ANDROID_SDK_DIR/tools"
        ln -sf "$ANDROID_SDK_DIR/cmdline-tools/latest/bin" "$ANDROID_SDK_DIR/tools/bin"

        # 4. قبول كافة الرخص رسمياً وتثبيت build-tools الإلزامية
        yes | "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses --sdk_root="$ANDROID_SDK_DIR" || true
        "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "build-tools;33.0.2" "platforms;android-33" "platform-tools" --sdk_root="$ANDROID_SDK_DIR" || true

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: bin/*.apk
